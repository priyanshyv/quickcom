<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QuickCom Customer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root { --ok: #0c831f; --warn: #b26a00; --bad: #b3261e; --muted: #666; --line: #e6e6e6; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fff; color: #111; }
    .wrap { display: grid; grid-template-columns: 1fr 420px; height: 100%; }
    #map { height: 100%; }
    .side { overflow-y: auto; border-left: 1px solid var(--line); padding: 14px 16px; }
    @media (max-width: 800px) { .wrap { grid-template-columns: 1fr; grid-template-rows: 45vh 1fr; } .side { border-left: 0; border-top: 1px solid var(--line); } }
    h1 { font-size: 16px; margin: 0 0 8px; }
    .presets button { font-size: 12px; margin: 0 4px 6px 0; padding: 4px 8px; border: 1px solid var(--line); background: #fafafa; border-radius: 6px; cursor: pointer; }
    .banner { padding: 10px 12px; border-radius: 8px; margin: 8px 0 12px; font-size: 14px; }
    .banner.ok { background: #eaf7ec; } .banner.bad { background: #fdecea; }
    .banner b.eta { font-size: 20px; color: var(--ok); }
    .debug { font-size: 11px; color: var(--muted); margin-top: 4px; font-family: ui-monospace, monospace; }
    h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 14px 0 6px; }
    .item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
    .item .name small { color: var(--muted); }
    .rx { font-size: 10px; background: #eef; color: #335; padding: 1px 4px; border-radius: 4px; margin-left: 4px; }
    .badge { font-size: 11px; white-space: nowrap; }
    .badge.in { color: var(--ok); } .badge.low { color: var(--warn); font-weight: 600; } .badge.out { color: var(--bad); }
    .item.out .name { opacity: .45; }
  </style>
</head>
<body>
<div class="wrap">
  <div id="map"></div>
  <div class="side">
    <h1>QuickCom · customer home screen</h1>
    <div class="presets">
      <button data-ll="12.9346,77.6113">Forum Mall</button>
      <button data-ll="12.9250,77.6350">KOR/HSR overlap</button>
      <button data-ll="12.9756,77.6066">MG Road (gap)</button>
      <button data-ll="12.8452,77.6602">Electronic City</button>
    </div>
    <div style="font-size:12px;color:var(--muted)">Or click anywhere on the map to "open the app" there.</div>
    <div id="out"></div>
  </div>
</div>
<script>
  const map = L.map('map').setView([12.95, 77.63], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; OpenStreetMap' }).addTo(map);
  let you;

  fetch('/stores').then(r => r.json()).then(fc => {
    L.geoJSON(fc, {
      style: { color: '#0c831f', weight: 1, fillOpacity: 0.06 },
      pointToLayer: (f, ll) => L.circleMarker(ll, { radius: 6, color: '#0c831f', fillOpacity: 1 }).bindTooltip(f.properties.code),
    }).addTo(map);
  });

  const rupees = (p) => '₹' + (p / 100).toFixed(p % 100 ? 2 : 0);
  const badge = (s) => s === 'in' ? '<span class="badge in">In stock</span>'
    : s === 'out' ? '<span class="badge out">Out of stock</span>'
    : `<span class="badge low">Only ${s.split(':')[1]} left</span>`;

  async function open(lat, lng) {
    if (you) you.remove();
    you = L.marker([lat, lng]).addTo(map);
    const t0 = performance.now();
    const res = await fetch(`/home?lat=${lat}&lng=${lng}`).then(r => r.json());
    const ms = (performance.now() - t0).toFixed(1);
    const loc = res.location, el = document.getElementById('out');
    const dbg = `<div class="debug">serviceability via <b>${loc.via}</b> · cell ${loc.cell} · ${ms} ms round trip</div>`;
    if (!loc.serviceable) {
      el.innerHTML = `<div class="banner bad"><b>Sorry, we don't deliver here yet.</b><br>You're between our stores' delivery areas.${dbg}</div>`;
      return;
    }
    let html = `<div class="banner ok">Delivering in <b class="eta">${loc.promiseMinutes} min</b><br>
      from <b>${loc.store.name}</b> · ${(loc.distanceMeters / 1000).toFixed(1)} km away
      ${loc.alternatives.length ? `<br><small>Also covered by: ${loc.alternatives.join(', ')}</small>` : ''}${dbg}</div>`;
    for (const sec of res.sections) {
      html += `<h2>${sec.category}</h2>`;
      for (const it of sec.items) {
        html += `<div class="item ${it.stock === 'out' ? 'out' : ''}">
          <div class="name">${it.name}${it.rxRequired ? '<span class="rx">Rx</span>' : ''}<br><small>${it.packSize} · ${rupees(it.mrpPaise)}</small></div>
          ${badge(it.stock)}</div>`;
      }
    }
    el.innerHTML = html;
  }

  map.on('click', (e) => open(e.latlng.lat.toFixed(6), e.latlng.lng.toFixed(6)));
  document.querySelectorAll('.presets button').forEach(b => b.onclick = () => {
    const [lat, lng] = b.dataset.ll.split(',');
    map.setView([lat, lng], 14);
    open(lat, lng);
  });
</script>
</body>
</html>
